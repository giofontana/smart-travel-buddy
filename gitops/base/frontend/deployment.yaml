apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smart-travel-buddy
  labels:
    app: frontend
    app.kubernetes.io/part-of: smart-travel-buddy
    component: frontend
    deploy-name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: smart-travel-buddy/frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
