  cultural--australia.md: '# Australia - Cultural Etiquette


    ## Greetings

    Very casual and friendly. "G''day mate" or "how ya going" standard. First names used immediately, even with strangers. Firm handshakes. Tall poppy syndrome - don''t boast or act superior. Self-deprecating humor valued. Egalitarian culture - everyone treated equally.


    ## Tipping

    Not expected or required - living wages paid. Rounding up appreciated. Upscale restaurants 10% for exceptional service. Taxi drivers keep change. No pressure to tip. Culture slowly changing but still minimal compared to US.


    ## Dining

    BBQ culture strong - often BYO drinks. Brunch huge - cafes packed weekends. Coffee culture serious - flat whites standard. Asian food influences strong. Meat pies national snack. Fish and chips at beach tradition. Vegemite is acquired taste. Splitting bills (going Dutch) normal.


    ## Dress Codes

    Very casual overall. Thongs (flip-flops) acceptable most places. Beach culture dominant - swimwear common. Some clubs require closed-toe shoes. Business casual for work. No shoes no service some venues. Sun protection essential - slip slop slap (sunscreen culture).


    ## Taboos

    Taking yourself too seriously. Littering or not respecting nature. Drinking and driving strictly enforced. Swimming outside flagged areas dangerous. Not knowing how to handle drop bears (joke tourists fall for). Complaining about heat/sun (you chose to visit).


    ## Useful Phrases

    Arvo (afternoon), servo (gas station), bottle-o (liquor store), brekkie (breakfast), no worries (you''re welcome), cheers (thanks), reckon (think), yeah nah (no), nah yeah (yes), fair dinkum (really/genuine), she''ll be right (it''ll be okay).

    '
  cultural--brazil.md: '# Brazil - Cultural Etiquette


    ## Greetings

    Very warm and physical. Kisses on both cheeks standard (sometimes one in Sao Paulo, three in Belo Horizonte). Hugs and back pats among men. Close personal space. Eye contact important. First names used immediately. "Tudo bem?" (all good?) standard greeting - answer "tudo" (all good).


    ## Tipping

    10% service charge often included (check for "servico"). If not, 10% expected. Round up taxi fare. Hotel staff few reais. Street parking attendants (flanelinhas) 2-5 reais. Bar/restaurant 10% if no service charge. Beauty salons 10-15%.


    ## Dining

    Late meals - lunch after 12:30pm, dinner after 8pm. Rodizio (all-you-can-eat) restaurants use card system: green=more, red=stop. Feijoada (black bean stew) traditional Saturday lunch. Acai bowls everywhere. Cafezinho (small strong coffee) offered constantly. Sharing pizza/dishes common. Don''t order cappuccino - "cafe com leite" is standard.


    ## Dress Codes

    Beach culture dominant - minimal clothing at beach. Havaianas (flip-flops) everywhere. Dress well for nights out - Brazilians care about appearance. Avoid shorts in upscale restaurants. Clubbing requires stylish dress. Casual elsewhere but put-together.


    ## Taboos

    OK hand gesture offensive (avoid). Discussing poverty/crime insensitively. Comparing Brazil to Spanish-speaking countries (speak Portuguese). Expecting punctuality - flexible time culture. Walking alone at night in unfamiliar areas. Displaying expensive items openly.


    ## Useful Phrases

    Oi/ola (hi), obrigado/a (thanks - o=male, a=female), por favor (please), com licenca (excuse me), nao falo portugues (I don''t speak Portuguese), quanto custa (how much), onde fica (where is), fala ingles (speak English), valeu (thanks/cool).

    '
  cultural--france.md: '# France - Cultural Etiquette


    ## Greetings

    Always say "bonjour" when entering shops and "au revoir" when leaving. Kiss on cheeks (la bise) among friends but handshake for formal. Address as Monsieur/Madame unless invited to use first names. Failure to greet considered very rude.


    ## Tipping

    Service (15%) included in bill by law. Round up or leave small change (1-2 euros) for good service. At cafes, leave coins. Taxi drivers appreciate rounding up fare. Not expected but appreciated for exceptional service.


    ## Dining

    Keep hands on table (not lap) but not elbows. Bread placed on table, not plate. Don''t cut salad with knife. Finish everything on plate. Lunch 12-2pm, dinner after 8pm. Don''t ask for doggy bags. Splitting bills (l''addition) accepted but not common among French.


    ## Dress Codes

    Dress well - French value style. Avoid athletic wear outside gym. Smart casual minimum for restaurants. Cover shoulders and knees in churches. No shorts for men in upscale venues.


    ## Taboos

    Speaking loudly in public. Drinking coffee with meals (it''s after). Expecting shops open Sundays or during lunch. Asking personal questions immediately. Assuming everyone speaks English.


    ## Useful Phrases

    S''il vous plait (please), merci (thanks), pardon (excuse me), je ne parle pas francais (I don''t speak French), l''addition s''il vous plait (check please), ou sont les toilettes (where''s bathroom).

    '
  cultural--italy.md: '# Italy - Cultural Etiquette


    ## Greetings

    Handshakes or kisses on both cheeks among friends. Always greet shopkeepers with "buongiorno" (morning) or "buonasera" (evening). Eye contact important. Italians expressive and animated - don''t take raised voices as anger.


    ## Tipping

    Not expected but appreciated. Service (coperto) charge often on bill for bread/table. Round up bill or leave 5-10% for good service. Bartenders get small change. Not tipping is acceptable but rude for excellent service.


    ## Dining

    Cappuccino only before 11am - espresso after meals. Pasta is first course, not main. Don''t ask for parmesan on seafood pasta. Lunch 1-3pm, dinner 8pm or later. Splitting bills unusual - one person pays. Don''t rush meals - dining is social. Standing at bar cheaper than table service.


    ## Dress Codes

    Italians dress well - la bella figura matters. Avoid beachwear away from beach. Cover shoulders and knees in churches (scarves provided). No shorts for men in fine dining. Sneakers acceptable but not athletic wear.


    ## Taboos

    Ordering cappuccino after meals. Asking for substitutions or changes to dishes. Putting feet on furniture. Being loud in churches. Expecting fast service. Walking into churches during mass as tourist.


    ## Useful Phrases

    Per favore (please), grazie (thanks), scusi (excuse me), non parlo italiano (I don''t speak Italian), il conto per favore (check please), dov''e il bagno (where''s bathroom), parla inglese (speak English).

    '
  cultural--japan.md: '# Japan - Cultural Etiquette


    ## Greetings

    Bow slightly when meeting someone. Deeper bows show more respect. Business cards (meishi) exchanged with both hands and examined carefully - never put directly in pocket. Remove shoes when entering homes, temples, some restaurants (look for genkan entrance area with shoe racks).


    ## Tipping

    Never tip - it''s considered insulting. Service charge included. Exceptional service already expected. Handing money directly rude - use trays at registers. If you must show gratitude, small gifts (omiyage) from your home country appreciated.


    ## Dining

    Say "itadakimasu" before eating, "gochisosama" after. Don''t stick chopsticks upright in rice (funeral ritual). Slurping noodles is polite - shows appreciation. Pour drinks for others, not yourself. At sushi bars, eat fish side down on tongue. Don''t walk while eating.


    ## Dress Codes

    Generally conservative. Remove shoes frequently - wear clean socks without holes. Tattoos can prevent entry to onsen (hot springs) and gyms. Modest clothing for temples - shoulders covered.


    ## Taboos

    Loud phone conversations on trains prohibited. Standing on wrong side of escalator (left in Tokyo, right in Osaka). Blowing nose in public rude - sniffling acceptable. Eating on most trains.


    ## Useful Phrases

    Sumimasen (excuse me/sorry), arigatou gozaimasu (thank you), eigo wa hanasemasu ka (do you speak English), oishii (delicious), kanpai (cheers).

    '
  cultural--south-africa.md: '# South Africa - Cultural Etiquette


    ## Greetings

    Handshakes common. Use titles (Mr/Mrs) unless invited otherwise. "How are you?" expected before business - relationships matter. Ubuntu philosophy: humanity toward others. Multiple cultures mean varied customs - observe and adapt. English widely spoken but 11 official languages.


    ## Tipping

    Expected. Restaurants 10-15%. Gas station attendants (full service) 5-10 rand. Car guards watching parking 5-10 rand. Safari guides and trackers 100-200 rand per day. Hotel porters 10-20 rand. Township tour guides generous tip appreciated.


    ## Dining

    Braai (BBQ) culture central - social gathering. Biltong (dried meat) snack everywhere. Mix of African, European, Indian cuisine. Lunch 12-2pm, dinner 7-9pm. Splitting bills acceptable. Wine culture strong and affordable. Try local beers. Portion sizes generous.


    ## Dress Codes

    Generally casual but smart. Safari neutral colors (khaki, olive, beige). Conservative dress in townships and rural areas. Beach casual at coast. Layers essential - temperature swings. Sun protection critical. Upscale restaurants require smart casual.


    ## Taboos

    Discussing race and apartheid without sensitivity - complex history. Assuming homogeneity - very diverse nation. Flashing wealth in unequal society. Not respecting personal space and property (safety concerns). Drinking tap water outside major cities. Ignoring safety advice.


    ## Useful Phrases

    Howzit (how are you), lekker (nice/cool), braai (BBQ), bru (friend), eish (expression of surprise/frustration), robot (traffic light), bakkie (pickup truck), just now (later, not immediately), now now (soon), sharp (okay/thanks).

    '
  cultural--spain.md: '# Spain - Cultural Etiquette


    ## Greetings

    Dos besos (two kisses) standard among friends and women. Men shake hands or hug. Greet shopkeepers always. Siesta culture real - shops close 2-5pm. Dinner very late (9-11pm). Punctuality relaxed for social events.


    ## Tipping

    Not expected but rounding up appreciated. Leave small change at bars and cafes. Restaurants 5-10% for good service optional. Taxi drivers appreciate rounding up. Service staff paid living wage unlike US.


    ## Dining

    Tapas culture: order multiple small plates to share. Free tapas with drinks in some regions. Lunch is main meal (2-4pm). Dinner late and lighter. Don''t expect fast service - meals are leisurely. Standing at bar cheaper than sitting. Throwing napkins on floor in some taverns traditional.


    ## Dress Codes

    Casual but stylish. Avoid athletic wear outside gym. Beach attire stays at beach. Cover up in churches. Evening paseo (stroll) is dressed-up social time. Regional variation - Barcelona more casual than Madrid.


    ## Taboos

    Being loud and demanding. Expecting early dinner. Wearing shoes indoors in homes. Criticizing local customs. Comparing Spain to Latin America. Assuming bullfighting is universally loved. Mistaking Catalan/Basque culture for Spanish.


    ## Useful Phrases

    Por favor (please), gracias (thanks), perdon (excuse me), no hablo espanol (I don''t speak Spanish), la cuenta por favor (check please), donde esta el bano (where''s bathroom), habla ingles (speak English), vale (okay).

    '
  cultural--thailand.md: '# Thailand - Cultural Etiquette


    ## Greetings

    Wai greeting: press palms together near chest and bow slightly. Higher hands show more respect. Return wai unless from child or service staff. Smile frequently - "Land of Smiles" reputation earned. Remove shoes before entering homes and temples. Never touch heads - most sacred body part.


    ## Tipping

    Not traditional but increasingly expected in tourist areas. Restaurants 10% if no service charge. Round up taxi fares. Massage therapists 50-100 baht. Hotel staff small bills. Street food vendors no tip needed. Being generous appreciated.


    ## Dining

    Eat with spoon in right hand, fork in left (fork pushes food onto spoon). Chopsticks for noodles only. Sharing dishes common - order several and share. Don''t finish everything (implies host didn''t provide enough). Street food safe and delicious. Try everything with lime and chili.


    ## Dress Codes

    Modest dress for temples: shoulders and knees covered, no tight clothing. Casual elsewhere but beachwear stays at beach. Removing shoes constantly - slip-ons practical. Light, breathable fabrics for heat and humidity.


    ## Taboos

    Disrespecting Buddha images or monks (never touch, women cannot touch monks). Pointing feet at people or Buddha. Touching heads. Showing anger publicly. Criticism of royal family (lese-majeste laws enforced). Public displays of affection. Stepping on money (has king''s image).


    ## Useful Phrases

    Sawasdee ka/krap (hello - ka feminine, krap masculine), khop khun (thank you), mai pen rai (no problem), aroi (delicious), tao rai (how much), mai ow (don''t want), sabai sabai (take it easy).

    '
  cultural--uk.md: '# UK - Cultural Etiquette


    ## Greetings

    Handshakes standard in formal settings. British are polite but reserved - don''t expect immediate warmth. Queuing (standing in line) sacred - never jump queue. "Sorry" used constantly, even when not at fault. Small talk about weather safe.


    ## Tipping

    10-15% in restaurants if service not included (check bill). Round up taxi fare. Pub table service 10%, bar service not expected. Hairdressers 10%. Delivery drivers few pounds. Less expected than US. Tipping culture increasing but not mandatory.


    ## Dining

    Pub culture central - order at bar, pay immediately, return glass when done. Sunday roast traditional. Afternoon tea formal - scone etiquette: jam then cream (or reverse in Devon). Dinner later than US but earlier than continental Europe. Splitting bills acceptable.


    ## Dress Codes

    Smart casual common. Pubs and casual dining very relaxed. Some restaurants and clubs require smart dress. Umbrellas essential year-round. Layers recommended for unpredictable weather. Regional variation - London more formal.


    ## Taboos

    Jumping queue - most serious offense. Speaking loudly on public transport. Not saying please and thank you. Discussing money. Standing on wrong side of escalator (stand right, walk left). Not buying round of drinks when your turn.


    ## Useful Phrases

    Cheers (thanks/bye/toast), lovely (positive), brilliant (great), quid (pound), loo (bathroom), mate/love (casual address). "You alright?" is greeting, not concern - answer "yeah, you?" Mind the gap (watch step on tube).

    '
  cultural--usa.md: '# USA - Cultural Etiquette


    ## Greetings

    Handshakes common - firm grip expected. First names used quickly, even with strangers. Eye contact shows confidence and honesty. Personal space larger than Europe - arm''s length distance. Casual, friendly demeanor standard.


    ## Tipping

    Mandatory, not optional. Restaurants 15-20% pretax. Bars $1-2 per drink. Taxis 15-20%. Hotel housekeeping $2-5 per night. Delivery drivers 15-20%. Hair salons 15-20%. Withholding tip signals very poor service. Many workers rely on tips for income.


    ## Dining

    Portions are huge. Doggy bags normal and expected. Free water and refills standard. Split checks common - just ask server. Casual dining dress accepted most places. Eating while walking fine. Dinner often early (6-7pm) compared to Europe.


    ## Dress Codes

    Very casual overall. Athletic wear acceptable in public. Jeans standard. Most restaurants accept casual dress. Some upscale venues require business casual. Regional variation - coasts more fashion conscious, middle America very casual.


    ## Taboos

    Discussing politics and religion with strangers increasingly sensitive. Smoking heavily restricted - designated areas only. Not tipping. Cutting in line (queue jumping). Asking age or salary.


    ## Useful Phrases

    Regional greetings vary. "How are you" is greeting, not real question - answer "good, thanks" not detailed response. "Y''all" in South, "you guys" elsewhere. "Excuse me" for getting attention or apologizing.

    '
  destinations--bangkok.md: '# Bangkok


    ## Overview

    Chaotic, vibrant capital of Thailand. Mix of ornate temples, modern malls, street food, and nightlife. Traffic notorious - plan extra time. Humid year-round. Very affordable. English widely spoken in tourist areas. Extremely foreigner-friendly. Markets and street food define the culture.


    ## Best Time to Visit

    November-February for cooler, dry weather. March-May extremely hot. June-October rainy season but showers usually brief. Avoid Songkran (mid-April water festival) unless you enjoy city-wide water fights.


    ## Neighborhoods

    Old City: Grand Palace, Wat Pho, historic temples. Khao San Road: Backpacker central. Sukhumvit: Modern, expat area, nightlife. Silom: Business district, night markets. Chinatown: Street food heaven. Thonburi: Quieter, canals, local life.


    ## Transportation

    BTS Skytrain and MRT subway avoid traffic - get Rabbit card. Taxis cheap but use meter or Grab app. Tuk-tuks fun but negotiate price first. River boats along Chao Phraya offer scenic transport. Walking difficult due to heat and broken sidewalks. Motorbike taxis for short distances.


    ## Must-See Spots

    Grand Palace and Wat Phra Kaew (dress modestly), Wat Pho reclining Buddha, Wat Arun, floating markets (Damnoen Saduak touristy, Amphawa more authentic), Chatuchak weekend market. Street food essential: pad thai, mango sticky rice, tom yum. Get Thai massage. Respect Buddha images and monks.

    '
  destinations--barcelona.md: '# Barcelona


    ## Overview

    Catalonia''s capital on Mediterranean coast. Distinct identity from rest of Spain - Catalan language and culture strong. Gaudi architecture defines the cityscape. Beach city with urban energy. Layout based on grid (Eixample) plus medieval Gothic Quarter. Siesta culture affects shop hours.


    ## Best Time to Visit

    May-June or September-October for warm weather without peak summer crowds. August is hot and locals vacation. Winter mild but some beach businesses close. La Merce festival in September features cultural celebrations.


    ## Neighborhoods

    Gothic Quarter: Medieval streets, cathedral, tapas bars. Eixample: Modernist architecture, Gaudi buildings, upscale shopping. El Born: Trendy, Picasso Museum. Barceloneta: Beach, seafood. Gracia: Bohemian, local life. Montjuic: Hill with museums and Olympic sites.


    ## Transportation

    Metro efficient and affordable - T10 ticket covers 10 rides. Bus network extensive. Las Ramblas walkable but watch for pickpockets. Bike lanes expanding. Taxis reasonable. Airport connected by train and bus. Most attractions within metro reach.


    ## Must-See Spots

    Sagrada Familia (book timed entry weeks ahead), Park Guell (timed entry), Casa Batllo, La Boqueria market, Gothic Quarter wander. Beaches decent but crowded in summer. Tapas culture: small plates at multiple bars. Try jamon iberico, pan con tomate, vermouth. Dinner starts 9pm or later.

    '
  destinations--cape-town.md: '# Cape Town


    ## Overview

    South Africa''s coastal gem between mountains and ocean. Three main areas: City Bowl, Atlantic Seaboard (beaches), Southern Suburbs. Stunning natural beauty with challenging inequality. English widely spoken. Very affordable for tourists. Mediterranean climate. Car recommended for exploring beyond city center.


    ## Best Time to Visit

    November-March for summer and beach weather. December-January peak season and crowded. April-May or September-October for mild weather and wine harvest. Winter (June-August) cold and rainy but whale watching season.


    ## Neighborhoods

    City Bowl: CBD, V&A Waterfront, shops. Camps Bay: Beach, restaurants, sunset views. Woodstock: Arts, hipster cafes, galleries. Sea Point: Coastal promenade. Constantia: Wine estates. Kalk Bay: Fishing village charm, antiques.


    ## Transportation

    Car rental recommended for Table Mountain, Cape Point, wine routes. MyCiti bus serves waterfront and major routes - buy card at kiosks. Uber widely available and affordable. Trains exist but not recommended for tourists. Tours common for wine tasting and safaris.


    ## Must-See Spots

    Table Mountain cableway (check wind conditions), Cape Point, Boulders Beach penguins, V&A Waterfront, Robben Island tour (book ahead), Kirstenbosch Botanical Gardens. Wine tasting in Stellenbosch and Franschhoek. Try bobotie, biltong, bunny chow. Township tours available for cultural context. Beach sunsets spectacular.

    '
  destinations--london.md: '# London


    ## Overview

    Sprawling city divided by the Thames River and organized into boroughs. Central London covers Westminster, City of London, West End. Mix of historic landmarks and modern culture. English spoken but diverse accents. Expensive compared to most cities. Weather unpredictable - always carry layers.


    ## Best Time to Visit

    May-June or September for mild weather and festivals. July-August warm but crowded. Winter dark and cold but magical with Christmas lights. Spring sees parks bloom. Book accommodation early for summer.


    ## Neighborhoods

    Westminster: Parliament, Big Ben, Buckingham Palace. West End: Theater, shopping, Soho nightlife. South Bank: Thames walks, markets, Tate Modern. Camden: Markets, alternative culture. Shoreditch: Hipster East London. Notting Hill: Portobello Market, colorful houses.


    ## Transportation

    Tube (Underground) is extensive - get Oyster card or use contactless payment. Buses offer sightseeing (sit upstairs). Overground and trains connect outer areas. Walking along Thames recommended. Black cabs iconic but pricey. Bike hire available. Congestion charges for driving.


    ## Must-See Spots

    British Museum (free), Tower of London, Westminster Abbey, Changing of Guard at Buckingham Palace, Tate galleries (free), Borough Market for food, Hyde Park. Afternoon tea is touristy but fun. Pub culture essential - try traditional Sunday roast. West End shows rival Broadway. Many museums free.

    '
  destinations--new-york.md: '# New York City


    ## Overview

    Five boroughs: Manhattan (main tourist area), Brooklyn (hipster neighborhoods, food scene), Queens (diversity, airports), Bronx (Yankees, zoo), Staten Island (ferry views). Grid system above 14th Street makes Manhattan navigation easy. Fast-paced, walkable, 24-hour city.


    ## Best Time to Visit

    September-November for fall colors and comfortable weather, or late April-June. Summer is hot and humid. Winter can be magical with holiday lights but bitterly cold. Avoid major holidays unless that''s the goal.


    ## Neighborhoods

    Midtown: Times Square, Broadway, Rockefeller Center. Upper West Side: Museums, Central Park. Village: Bohemian, cafes, NYU. Chelsea: High Line, galleries. Williamsburg/DUMBO Brooklyn: Hipster food and views. Financial District: 9/11 Memorial, historic downtown.


    ## Transportation

    Subway runs 24/7 on most lines. Get MetroCard or use contactless payment. Express vs local trains matter. Walking is common - comfortable shoes essential. Yellow cabs everywhere but Uber/Lyft often cheaper. Don''t rent a car.


    ## Must-See Spots

    Central Park, Metropolitan Museum, MoMA, Brooklyn Bridge walk, High Line park, 9/11 Memorial, Ellis Island. See a Broadway show, eat pizza (Joe''s, Prince Street), bagels (Russ & Daughters), diverse food in Queens. Visit observation decks: Top of the Rock or One World Trade Center.

    '
  destinations--paris.md: '# Paris


    ## Overview

    Paris is divided into 20 arrondissements (districts) spiraling clockwise from the center. Each has distinct character. The Seine River divides Right Bank (shopping, nightlife) from Left Bank (cafes, universities). Walking is often fastest for short distances.


    ## Best Time to Visit

    April-June or September-October for pleasant weather and fewer crowds. August sees many locals leave and some shops close. December offers Christmas markets but can be cold and gray.


    ## Neighborhoods

    1st-4th: Historic center, museums, Notre-Dame. 5th-6th: Latin Quarter, student life, cafes. 7th: Eiffel Tower, elegant residential. 9th: Opera, department stores. 18th: Montmartre, artists, Sacre-Coeur. Marais (3rd-4th): Trendy, historic Jewish quarter.


    ## Transportation

    Metro is extensive and runs until 1am (2am weekends). Buy carnet (10 tickets) or Navigo pass. RER trains connect suburbs. Velib bike-share available. Central areas walkable. Taxis expensive; Uber works.


    ## Must-See Spots

    Eiffel Tower (book online to skip lines), Louvre (Wednesday/Friday evenings less crowded), Musee d''Orsay, Notre-Dame exterior, Sainte-Chapelle stained glass, Luxembourg Gardens. Eat croissants at local boulangeries, try bistros in residential areas, visit food markets like Marche d''Aligre.

    '
  destinations--rio-de-janeiro.md: '# Rio de Janeiro


    ## Overview

    Brazil''s beach metropolis famous for Christ statue, carnival, and carioca culture. Portuguese spoken - limited English outside tourist areas. Dramatic landscape with beaches, mountains, favelas. Safety requires awareness. Extremely friendly locals. Music and beach life define the culture. Very affordable.


    ## Best Time to Visit

    December-March for summer and Carnival (February/March) but hot and crowded. September-November for spring weather and fewer tourists. Avoid June-August winter - cooler and rainier. Book far ahead for Carnival. Beach culture year-round.


    ## Neighborhoods

    Copacabana: Iconic beach, hotels, touristy. Ipanema/Leblon: Upscale, trendy, better beach. Santa Teresa: Bohemian hills, trams, art. Centro: Historic downtown, business. Lapa: Nightlife, samba, arches. Barra da Tijuca: Modern, long beach, Olympic sites.


    ## Transportation

    Metro limited but connects beaches to Centro. Buses extensive but confusing. Uber and 99 taxi apps essential and cheap. Official yellow taxis okay. Walking fine in beach neighborhoods during day. Avoid isolated areas at night. Cars face heavy traffic.


    ## Must-See Spots

    Christ the Redeemer (book online, go early for light and fewer crowds), Sugarloaf Mountain cable car, Copacabana and Ipanema beaches, Escadaria Selaron steps, Lapa nightlife for live samba. Try feijoada, acai bowls, caipirinhas, pao de queijo. Beach culture: rent chair and umbrella. Football match if possible.

    '
  destinations--rome.md: '# Rome


    ## Overview

    Ancient ruins mix with baroque churches and modern life in this chaotic, charming city. Built on seven hills with narrow cobblestone streets. Cars and scooters dominate traffic. Most major sites walkable in historic center. Italian required less than expected in tourist areas.


    ## Best Time to Visit

    April-May or September-October for mild weather. Avoid August when locals flee and heat is oppressive. Winter is quiet but some sites have shorter hours. Easter brings massive crowds but special celebrations.


    ## Neighborhoods

    Centro Storico: Pantheon, Piazza Navona, Trevi Fountain. Trastevere: Cobblestone charm, nightlife, restaurants. Vatican area: St. Peter''s, museums. Monti: Bohemian, cafes, vintage shops. Testaccio: Food market, authentic Roman cuisine.


    ## Transportation

    Walking is primary for center. Metro has only 3 lines but connects key sites. Buses extensive but confusing. Taxis available - use official white cabs or apps. Roma Pass offers transport and museum entry. Most streets not wheelchair accessible.


    ## Must-See Spots

    Colosseum and Roman Forum (book timed entry), Vatican Museums and Sistine Chapel (book ahead, dress modestly), Pantheon (free), Spanish Steps, Villa Borghese gardens. Eat cacio e pepe, carbonara, and pizza al taglio. Gelato from small artisan shops, not chains. Aperitivo hour offers buffet with drinks.

    '
  destinations--sydney.md: '# Sydney


    ## Overview

    Australia''s largest city wraps around stunning harbour. Beach culture meets urban sophistication. Expensive city with high quality of life. English speaking with Aussie slang. Laid-back attitude despite size. Weather dominates lifestyle - outdoor dining and beaches central to culture.


    ## Best Time to Visit

    September-November (spring) or March-May (autumn) for mild weather. December-February is summer - hot, crowded beaches, high prices. Winter (June-August) mild but can be rainy. Christmas and New Year extremely expensive.


    ## Neighborhoods

    CBD: Opera House, Harbour Bridge, Circular Quay. The Rocks: Historic, weekend markets. Darling Harbour: Tourist attractions, restaurants. Bondi/Coogee: Beach culture, coastal walks. Newtown: Alternative, students, cafes. Surry Hills: Trendy dining, bars.


    ## Transportation

    Trains, buses, ferries use Opal card or contactless payment. Ferries to Manly offer scenic harbour crossing. Trains connect beaches and suburbs. Walking pleasant in centre. Taxis expensive - Uber common. Car unnecessary in city. Sydney Airport train has hefty surcharge.


    ## Must-See Spots

    Opera House tour, Harbour Bridge climb or walk, Bondi to Coogee coastal walk, Royal Botanic Gardens, Taronga Zoo, ferry to Manly Beach. Brunch culture strong - try flat white coffee. Meat pies, Tim Tams, fish and chips at beach. Markets on weekends. Pub culture for sports viewing.

    '
  destinations--tokyo.md: '# Tokyo


    ## Overview

    Tokyo is Japan''s capital and a massive metropolis blending ultra-modern with traditional. Home to 14 million people, it''s organized into distinct neighborhoods (called ku or wards) connected by the world''s most efficient train system. English signage is improving but limited outside tourist areas.


    ## Best Time to Visit

    March-April for cherry blossoms or October-November for autumn colors and mild weather. Avoid Golden Week (late April/early May) and August (extremely humid and crowded). Winter is cold but clear.


    ## Neighborhoods

    Shinjuku: Business and entertainment hub with neon-lit nightlife and skyscrapers. Shibuya: Youth culture, famous crossing, shopping. Asakusa: Historic temples and traditional atmosphere. Harajuku: Fashion and quirky culture. Akihabara: Electronics and anime. Ginza: Upscale shopping.


    ## Transportation

    Get a Suica or Pasmo card immediately - rechargeable IC cards for trains, buses, and convenience stores. JR Yamanote Line circles the city. Trains stop around midnight. Taxis are expensive. Google Maps works perfectly for transit routing.


    ## Must-See Spots

    Senso-ji Temple in Asakusa, Meiji Shrine, Tsukiji Outer Market for breakfast, teamLab Borderless digital art museum, observation decks at Tokyo Skytree or Metropolitan Government Building (free). Try authentic ramen in tiny shops, conveyor belt sushi, and izakaya pubs.

    '
  packing--beach.md: '# Packing for Beach Vacation


    ## Essentials

    Passport, travel insurance, credit cards and cash, phone, sunglasses (polarized for water glare), waterproof bag or case for beach, reusable water bottle, beach towel (or rent at hotel), flip-flops, sun hat, reef-safe sunscreen (required many destinations).


    ## Clothing

    Swimwear (at least 2 so one can dry), cover-up for walking to/from beach, shorts, t-shirts, sundress or casual dress, sandals, one nicer outfit for dinner, light layers for air-conditioned restaurants/planes. Rash guard for extended sun exposure or snorkeling.


    ## Health

    High SPF reef-safe sunscreen (reapply frequently), after-sun lotion or aloe, insect repellent for evenings, anti-diarrheal medication, motion sickness tablets if doing boat trips, waterproof bandages, any prescriptions. Hydration critical in sun.


    ## Electronics

    Phone in waterproof case, portable charger, waterproof camera or GoPro for underwater, e-reader for beach reading, headphones, travel adapter. Keep electronics away from sand - bring ziplock bags.

    '
  packing--city-break.md: '# Packing for City Break


    ## Essentials

    Passport/ID, travel insurance, credit cards and some cash, phone with maps downloaded offline, power bank, reusable water bottle, small daypack or crossbody bag, city transit card or contactless payment card, umbrella (compact), guidebook or saved articles.


    ## Clothing

    Comfortable walking shoes broken in (you''ll walk miles daily), second pair for backup/evenings, 2-3 pants/jeans, 3-4 tops that mix and match, one smart outfit for nice restaurants/theater, light jacket or cardigan, weather-appropriate outer layer. Black jeans work everywhere. Avoid overpacking - cities have laundry.


    ## Health

    Any prescriptions, pain reliever for sore feet, blister plasters, hand sanitizer, basic first aid, allergy medication if needed. Comfortable shoes prevent most issues.


    ## Electronics

    Phone and charger, portable battery (essential for navigation and photos), headphones for transit, camera if not using phone, travel adapter for your destination, e-reader or tablet. Consider hotel safe for valuables when sightseeing.

    '
  packing--tropical.md: '# Packing for Tropical Destinations


    ## Essentials

    Passport with 6+ months validity, copies of documents, travel insurance, credit cards (inform bank), local currency small bills, unlocked phone, power adapter, reusable water bottle, dry bag for beaches, sunglasses with UV protection.


    ## Clothing

    Lightweight, breathable fabrics - linen, cotton, moisture-wicking synthetics. Shorts, t-shirts, sundresses, swimwear (2 sets to rotate), light long pants/skirt for temples, light long sleeves for sun/mosquitos, wide-brimmed hat, comfortable walking sandals, flip-flops for beach, closed shoes for evenings. Pack light - can buy cheaply locally.


    ## Health

    High SPF reef-safe sunscreen, insect repellent with DEET or picaridin, anti-diarrheal medication, oral rehydration salts, antihistamines, basic first aid, any prescriptions in original containers, mosquito net if staying budget accommodation, hand sanitizer, wet wipes.


    ## Electronics

    Phone with international plan or local SIM, portable charger, waterproof phone case, e-reader loaded with books, headphones, travel adapter, camera if not using phone. Keep electronics in waterproof bag during boat trips.

    '
  packing--winter.md: '# Packing for Winter Destinations


    ## Essentials

    Passport, travel insurance, credit cards, local currency, phone, power adapter, reusable water bottle, thermal flask for hot drinks, lip balm with SPF (sun reflects off snow), hand warmers for extreme cold, moisturizer for dry air.


    ## Clothing

    Layering system critical: base layer (thermal underwear, merino wool), mid layer (fleece, sweater), outer layer (waterproof insulated jacket). Warm pants, jeans, thermal leggings under pants if very cold. Waterproof boots with good traction, warm socks (wool or synthetic), gloves (waterproof outer, warm liner), scarf, beanie/hat covering ears. Pack coat-check bag for museums/restaurants.


    ## Health

    Sunscreen (still needed in snow), moisturizer and lip balm (heating dries skin), any prescriptions, pain reliever, blister plasters for walking, hand warmers, tissues. Hydration important despite cold.


    ## Electronics

    Phone (battery drains faster in cold - keep close to body), portable charger, camera, headphones, travel adapter. Bring cases/bags that work with gloved hands. Consider waterproof protection for snow.

    '
