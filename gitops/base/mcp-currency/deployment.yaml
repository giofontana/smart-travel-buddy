apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-currency
  namespace: smart-travel-buddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-currency
  template:
    metadata:
      labels:
        app: mcp-currency
    spec:
      containers:
        - name: mcp-currency
          image: smart-travel-buddy/mcp-currency:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
