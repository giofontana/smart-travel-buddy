apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base
  - ../../../base/postgresql-container
  - ../shared

images:
  - name: smart-travel-buddy/backend
    newName: image-registry.openshift-image-registry.svc:5000/smart-travel-buddy/smart-travel-buddy-backend
  - name: smart-travel-buddy/frontend
    newName: image-registry.openshift-image-registry.svc:5000/smart-travel-buddy/smart-travel-buddy-frontend
  - name: smart-travel-buddy/mcp-currency
    newName: image-registry.openshift-image-registry.svc:5000/smart-travel-buddy/smart-travel-buddy-mcp-currency
  - name: smart-travel-buddy/mcp-weather
    newName: image-registry.openshift-image-registry.svc:5000/smart-travel-buddy/smart-travel-buddy-mcp-weather
  - name: smart-travel-buddy/mcp-wikipedia
    newName: image-registry.openshift-image-registry.svc:5000/smart-travel-buddy/smart-travel-buddy-mcp-wikipedia

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEBUG
          value: "true"
