# The pipeline runs in smart-travel-buddy-pipeline but pushes images to, and restarts the
# deployments of, the smart-travel-buddy namespace. These grant its pipeline ServiceAccount
# just that in smart-travel-buddy.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smart-travel-buddy-pipeline-image-builder
  namespace: smart-travel-buddy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: smart-travel-buddy-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smart-travel-buddy-pipeline-restart-deployments
  namespace: smart-travel-buddy
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smart-travel-buddy-pipeline-restart-deployments
  namespace: smart-travel-buddy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: smart-travel-buddy-pipeline-restart-deployments
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: smart-travel-buddy-pipeline
