apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace transformer: the Pipeline runs in smart-travel-buddy-pipeline, while rbac.yaml
# grants it access to the app namespace (smart-travel-buddy).
# pipelinerun.yaml is not listed: it uses generateName, so it is created with `oc create`.
resources:
  - namespace.yaml
  - rbac.yaml
  - pipeline.yaml
